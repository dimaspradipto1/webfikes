<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Official BIMA (Basis Informasi Penelitian & Pengabdian) Vector -->
  <defs>
    <linearGradient id="bimaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4378"/>
      <stop offset="100%" stop-color="#07223D"/>
    </linearGradient>
    <linearGradient id="bimaEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C974"/>
      <stop offset="100%" stop-color="#008A4E"/>
    </linearGradient>
    <linearGradient id="bimaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E67E00"/>
    </linearGradient>
  </defs>

  <!-- Stylized Ganesha / Academic Research Crest -->
  <g transform="translate(0, -4)">
    <circle cx="80" cy="52" r="36" stroke="url(#bimaBlue)" stroke-width="4" fill="#ffffff"/>
    
    <!-- Inner dynamic arch & quill -->
    <path d="M68 40 C62 40 58 48 64 56 C70 64 74 72 72 80 C70 82 66 80 64 76" stroke="url(#bimaEmerald)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="68" cy="46" r="3" fill="url(#bimaGold)"/>
    <circle cx="88" cy="46" r="3" fill="url(#bimaGold)"/>
    <path d="M82 38 C90 38 98 44 94 56 C90 64 84 70 78 74" stroke="url(#bimaBlue)" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Central light ray -->
    <line x1="80" y1="28" x2="80" y2="34" stroke="url(#bimaGold)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Wordmark BIMA -->
  <text x="80" y="126" text-anchor="middle" fill="#07223D" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="26" font-weight="900" letter-spacing="3">BIMA</text>
  <!-- Subtext -->
  <text x="80" y="142" text-anchor="middle" fill="#008A4E" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7.5" font-weight="800" letter-spacing="1">KEMDIKBUDRISTEK</text>
</svg>
