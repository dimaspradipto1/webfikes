<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Official DIKTISAINTEK BERDAMPAK Vector -->
  <defs>
    <linearGradient id="diktiRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E61C38"/>
      <stop offset="100%" stop-color="#A6051B"/>
    </linearGradient>
    <linearGradient id="diktiNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3866"/>
      <stop offset="100%" stop-color="#041B33"/>
    </linearGradient>
    <linearGradient id="diktiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC019"/>
      <stop offset="100%" stop-color="#E08C00"/>
    </linearGradient>
  </defs>

  <!-- Impact / Rising Figure & Star of Higher Education -->
  <g transform="translate(0, -6)">
    <!-- Golden Achievement Star -->
    <polygon points="80,18 84,30 96,30 86,38 90,50 80,42 70,50 74,38 64,30 76,30" fill="url(#diktiGold)"/>

    <!-- Dynamic Human Figures striving upward -->
    <circle cx="80" cy="38" r="8" fill="url(#diktiRed)"/>
    <path d="M52 64 C52 50 66 44 80 50 C94 44 108 50 108 64 C100 78 80 82 80 92" stroke="url(#diktiNavy)" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Dynamic Impact Waves / Arch -->
    <path d="M42 86 C54 100 106 100 118 86" stroke="url(#diktiRed)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M56 104 Q80 112 104 104" stroke="url(#diktiGold)" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography Label -->
  <text x="80" y="128" text-anchor="middle" fill="#041B33" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1.2">DIKTISAINTEK</text>
  <text x="80" y="143" text-anchor="middle" fill="#A6051B" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="800" letter-spacing="1.5">BERDAMPAK</text>
</svg>
